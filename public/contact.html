<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | CodeForge</title>

<style>
body{
    background:#0e0d0b;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:60px auto;
    padding:20px;
}

input,textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:16px;
    border-radius:6px;
    border:1px solid #333;
    background:#141310;
    color:white;
}

button{
    background:#5b8eff;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}
</style>
</head>
<body>

<div class="container">

<h1>Contact CodeForge</h1>

<p>
Need help, found a bug, or have a suggestion?
Send us a message.
</p>

<form>
<label>Name</label>
<input type="text" required>

<label>Email</label>
<input type="email" required>

<label>Message</label>
<textarea rows="8" required></textarea>

<button type="submit">Send Message</button>
</form>

<p style="margin-top:30px;">
Email: r97041725@gmail.com
</p>

</div>

</body>
</html>
