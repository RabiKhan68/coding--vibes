<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | CodeForge</title>

<meta name="description" content="The page you're looking for doesn't exist. Return to CodeForge and continue coding.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0e0d0b;
    --surface:#141310;
    --border:#2a2620;
    --accent:#5b8eff;
    --accent2:#ff6b6b;
    --text:#e8e2d8;
    --text-muted:#8d867b;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    max-width:700px;
    padding:40px 20px;
    position:relative;
    z-index:2;
}

.error-code{
    font-size:clamp(100px,20vw,220px);
    font-weight:900;
    line-height:1;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

h1{
    font-size:clamp(28px,5vw,48px);
    margin-top:10px;
    margin-bottom:16px;
}

p{
    color:var(--text-muted);
    font-size:18px;
    line-height:1.8;
    margin-bottom:35px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:var(--accent);
    color:white;
    padding:14px 32px;
    border-radius:8px;
    font-weight:700;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(91,142,255,.3);
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    opacity:.15;
}

.blob1{
    width:400px;
    height:400px;
    background:var(--accent);
    top:-100px;
    left:-100px;
}

.blob2{
    width:350px;
    height:350px;
    background:var(--accent2);
    bottom:-100px;
    right:-100px;
}

.footer{
    margin-top:30px;
    font-size:14px;
    color:var(--text-muted);
}
</style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="container">

    <div class="error-code">404</div>

    <h1>Page Not Found</h1>

    <p>
        The page you're looking for may have been moved,
        deleted, or never existed.
    </p>

    <a href="/" class="btn">
        ← Back to CodeForge
    </a>

    <div class="footer">
        CodeForge • Real-Time Collaborative Coding Platform
    </div>

</div>

</body>
</html>
